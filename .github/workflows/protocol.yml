name: Protocol core

# Protocol v2 crypto core (docs/protocol.md §4.6): the C# and Kotlin Noise implementations each run the
# published vectors and their behaviour tests, then talk to each other live (Kotlin <-> C# interop).
# iOS: the same Kotlin core is compiled and its common tests (vectors + behaviour) run on the iOS simulator.
# The Kotlin hub client (shared/.../hub) is tested against the production C# AgentHost over real WebSockets,
# and the Kotlin AgentHost (shared/.../agent, Phase C) against both the Kotlin hub client and the C# gt-testhub.
on:
  pull_request:
    paths:
      - 'src/GameTimer.Protocol/**'
      - 'src/GameTimer.Relay/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.gitattributes'
      - 'global.json'
      - 'Directory.Build.*'
      - 'NuGet.config'
      - '.github/workflows/protocol.yml'
  push:
    branches: [master]
    paths:
      - 'src/GameTimer.Protocol/**'
      - 'src/GameTimer.Relay/**'
      - 'shared/**'
      - 'tests/**'
      - 'tools/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.gitattributes'
      - 'global.json'
      - 'Directory.Build.*'
      - 'NuGet.config'
      - '.github/workflows/protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR cancels the run in progress (the macOS job is the slow one)
concurrency:
  group: protocol-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: C# + Kotlin (JVM) + interop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: C# vectors + behaviour tests
        run: dotnet test tests/GameTimer.Protocol.Tests/GameTimer.Protocol.Tests.csproj -c Release

      - name: Build the C# interop peer, test agent, test hub and relay
        run: |
          dotnet build tests/interop/NoisePeer/NoisePeer.csproj -c Release -o "$RUNNER_TEMP/peer"
          dotnet build tests/interop/TestAgent/TestAgent.csproj -c Release -o "$RUNNER_TEMP/agent"
          dotnet build tools/GameTimer.TestHub/GameTimer.TestHub.csproj -c Release -o "$RUNNER_TEMP/hub"
          dotnet build src/GameTimer.Relay/GameTimer.Relay.csproj -c Release -o "$RUNNER_TEMP/relay"

      # Hub client vs the C# agent and vs the Kotlin agent; the C# hub (gt-testhub) vs the Kotlin agent
      - name: Kotlin vectors + behaviour + live interop tests (Noise peer, hub and agent both ways)
        run: ./gradlew :shared:jvmTest :shared:compileAndroidMain -PcsharpPeer="$RUNNER_TEMP/peer/NoisePeer.dll" -PcsharpAgent="$RUNNER_TEMP/agent/TestAgent.dll" -PcsharpHub="$RUNNER_TEMP/hub/gt-testhub.dll" -PcsharpRelay="$RUNNER_TEMP/relay/GameTimer.Relay.dll" -PliveRelay=wss://gametimer-relay.fly.dev/v2/agent

      - name: Publish gt-testhub (scripted parent app for testing on a real PC)
        run: dotnet publish tools/GameTimer.TestHub/GameTimer.TestHub.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o "$RUNNER_TEMP/testhub"

      - name: Upload gt-testhub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gt-testhub-win-x64
          path: ${{ runner.temp }}/testhub/
          retention-days: 14

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kotlin-test-report
          path: shared/build/reports/tests
          retention-days: 7

  ios:
    name: Kotlin (iOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Compile for devices, run common tests on the simulator
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:iosSimulatorArm64Test
