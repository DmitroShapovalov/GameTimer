name: Android app

# The parent app (android/) and the child's phone agent (child/, Phase C): debug APKs as artifacts, and an on-device test on an emulator that
# pairs with and controls the production C# agent (tests/interop/TestAgent --emulator, 10.0.2.2:5123).
on:
  pull_request:
    paths:
      - 'android/**'
      - 'child/**'
      - 'shared/**'
      - 'src/GameTimer.Protocol/**'
      - 'tests/interop/TestAgent/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - 'child/**'
      - 'shared/**'
      - 'src/GameTimer.Protocol/**'
      - 'tests/interop/TestAgent/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Build the debug APK
        env:
          # Firebase config for push wake-ups (protocol §10.6); without it the APK has push off
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: ./gradlew :android:assembleDebug :android:assembleDebugAndroidTest :child:assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gametimer-parent-debug-apk
          path: android/build/outputs/apk/debug/android-debug.apk
          retention-days: 14

      - name: Upload the child agent APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gametimer-child-debug-apk
          path: child/build/outputs/apk/debug/child-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: Start the C# test agent
        run: |
          dotnet build tests/interop/TestAgent/TestAgent.csproj -c Release -o "$RUNNER_TEMP/agent"
          nohup dotnet "$RUNNER_TEMP/agent/TestAgent.dll" --emulator > "$RUNNER_TEMP/agent.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5123/control/health > /dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/agent.log"
          curl -sf http://127.0.0.1:5123/control/health || { echo "test agent did not start"; exit 1; }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device test (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :android:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.requireAgent=true

      - name: "Test report (kept on success too, to show the on-device tests ran)"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-report
          path: |
            android/build/reports/androidTests
            ${{ runner.temp }}/agent.log
          retention-days: 7
