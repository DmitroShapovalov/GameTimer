name: Build & Release

# Every pull request and manual run builds the installer and attaches it as an artifact, so it can be
# tested on a real PC before release (and a broken setup.iss is caught before a tag is pushed).
# Tags (v*) additionally build the signed Android APK and publish a GitHub Release with both — in a
# separate job, the only one with write access.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 8
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          # The tag name is read from the environment and checked, never pasted into the script
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}(-rc([1-9]|[1-8][0-9]|9[0-8]))?$') { Write-Error "tag must be vX.Y.Z or vX.Y.Z-rcN (N 1-98)"; exit 1 }
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          }
          else { $v = "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: App logic tests
        run: dotnet test tests/GameTimer.Tests/GameTimer.Tests.csproj -c Release

      - name: Publish
        run: dotnet publish src/GameTimer/GameTimer.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: iscc installer/setup.iss /DAppVersion=${{ steps.ver.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GameTimerSetup-${{ steps.ver.outputs.version }}
          path: installer/Output/GameTimerSetup.exe
          retention-days: 14

  # The Android apps — the parent app and GameTimer Child (the agent on the child's phone, since v2.0) — as
  # signed release APKs with the same key, for v* tags only (PRs build the debug APKs in android.yml): the
  # release key never signs a branch. A tag without the signing secrets fails.
  # The signing secrets live in the "release" environment, which only v* tags may use (and which can
  # require the owner's approval): a pushed branch can't edit this file to reach them.
  apk:
    if: github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true # the job with the key never writes a cache

      # The tag name is untrusted text: only vX.Y.Z or vX.Y.Z-rcN gets through, and it's read from the
      # environment, never pasted into a script. versionCode = X·10⁶ + Y·10⁴ + Z·100 + (N or 99).
      - name: Version
        id: ver
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})(-rc([1-9]|[1-8][0-9]|9[0-8]))?$ ]]; then
            echo "::error::tag must be vX.Y.Z or vX.Y.Z-rcN (N 1-98)"; exit 1
          fi
          rc=${BASH_REMATCH[5]:-99}
          code=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 10000 + 10#${BASH_REMATCH[3]} * 100 + 10#$rc ))
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: the release APK can't be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          # A release without the Firebase config would silently have no notifications away from home
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "::error::secret GOOGLE_SERVICES_JSON is missing"; exit 1; fi
          ./gradlew :android:assembleRelease :child:assembleRelease "-PappVersionName=$VERSION" "-PappVersionCode=$CODE"
          signer="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$signer" verify --print-certs android/build/outputs/apk/release/android-release.apk
          "$signer" verify --print-certs child/build/outputs/apk/release/child-release.apk
          mv android/build/outputs/apk/release/android-release.apk "GameTimerParent-$VERSION.apk"
          mv child/build/outputs/apk/release/child-release.apk "GameTimerChild-$VERSION.apk"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GameTimerAndroid-${{ steps.ver.outputs.version }}
          path: |
            GameTimerParent-${{ steps.ver.outputs.version }}.apk
            GameTimerChild-${{ steps.ver.outputs.version }}.apk
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GameTimerSetup-${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: GameTimerAndroid-${{ needs.apk.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            GameTimerSetup.exe
            GameTimerParent-${{ needs.apk.outputs.version }}.apk
            GameTimerChild-${{ needs.apk.outputs.version }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
