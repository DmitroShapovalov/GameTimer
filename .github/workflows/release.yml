name: Build & Release

# Every pull request and manual run builds the installer and attaches it as an artifact, so it can be
# tested on a real PC before release (and a broken setup.iss is caught before a tag is pushed).
# Tags (v*) additionally build the signed Android APK and publish a GitHub Release with both — in a
# separate job, the only one with write access.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") { $v = "${{ github.ref_name }}" -replace '^v','' }
          else { $v = "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/GameTimer/GameTimer.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: iscc installer/setup.iss /DAppVersion=${{ steps.ver.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GameTimerSetup-${{ steps.ver.outputs.version }}
          path: installer/Output/GameTimerSetup.exe
          retention-days: 14

  # The parent app for Android: a signed release APK. Tags and manual runs only (PRs build the debug
  # APK in android.yml). A tag without the signing secrets fails: a release is never unsigned.
  apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          IFS=. read -r major minor patch <<< "${v%%-*}"
          code=$(( ${major:-0} * 10000 + ${minor:-0} * 100 + ${patch:-0} ))
          [ "$code" -gt 0 ] || code=1
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: the release APK can't be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :android:assembleRelease -PappVersionName=${{ steps.ver.outputs.version }} -PappVersionCode=${{ steps.ver.outputs.code }}
          apk=android/build/outputs/apk/release/android-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mv "$apk" "GameTimerParent-${{ steps.ver.outputs.version }}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTimerParent-${{ steps.ver.outputs.version }}
          path: GameTimerParent-${{ steps.ver.outputs.version }}.apk
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameTimerSetup-${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: GameTimerParent-${{ needs.apk.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameTimerSetup.exe
            GameTimerParent-${{ needs.apk.outputs.version }}.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
