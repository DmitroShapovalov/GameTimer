name: Build & Release

# Every pull request and manual run builds the installer and attaches it as an artifact, so it can be
# tested on a real PC before release (and a broken setup.iss is caught before a tag is pushed).
# Tags (v*) additionally build the signed Android APK and publish a GitHub Release with both — in a
# separate job, the only one with write access.
on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          # The tag name is read from the environment and checked, never pasted into the script
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}(-rc([1-9]|[1-8][0-9]|9[0-8]))?$') { Write-Error "tag must be vX.Y.Z or vX.Y.Z-rcN (N 1-98)"; exit 1 }
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          }
          else { $v = "0.0.0-ci.${{ github.run_number }}" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: dotnet publish src/GameTimer/GameTimer.csproj -c Release -r win-x64 --self-contained -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build Installer
        run: iscc installer/setup.iss /DAppVersion=${{ steps.ver.outputs.version }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: GameTimerSetup-${{ steps.ver.outputs.version }}
          path: installer/Output/GameTimerSetup.exe
          retention-days: 14

  # The parent app for Android: a signed release APK, for v* tags only (PRs build the debug APK in
  # android.yml): the release key never signs a branch. A tag without the signing secrets fails.
  # The signing secrets live in the "release" environment, which only v* tags may use (and which can
  # require the owner's approval): a pushed branch can't edit this file to reach them.
  apk:
    if: github.ref_type == 'tag'
    environment: release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true # the job with the key never writes a cache

      # The tag name is untrusted text: only vX.Y.Z or vX.Y.Z-rcN gets through, and it's read from the
      # environment, never pasted into a script. versionCode = X·10⁶ + Y·10⁴ + Z·100 + (N or 99).
      - name: Version
        id: ver
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]{1,3})\.([0-9]{1,2})\.([0-9]{1,2})(-rc([1-9]|[1-8][0-9]|9[0-8]))?$ ]]; then
            echo "::error::tag must be vX.Y.Z or vX.Y.Z-rcN (N 1-98)"; exit 1
          fi
          rc=${BASH_REMATCH[5]:-99}
          code=$(( 10#${BASH_REMATCH[1]} * 1000000 + 10#${BASH_REMATCH[2]} * 10000 + 10#${BASH_REMATCH[3]} * 100 + 10#$rc ))
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: the release APK can't be signed"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
        run: |
          ./gradlew :android:assembleRelease "-PappVersionName=$VERSION" "-PappVersionCode=$CODE"
          apk=android/build/outputs/apk/release/android-release.apk
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner" verify --print-certs "$apk"
          mv "$apk" "GameTimerParent-$VERSION.apk"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: GameTimerParent-${{ steps.ver.outputs.version }}
          path: GameTimerParent-${{ steps.ver.outputs.version }}.apk
          retention-days: 14

  release:
    if: github.ref_type == 'tag'
    needs: [build, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GameTimerSetup-${{ needs.build.outputs.version }}

      - uses: actions/download-artifact@v4
        with:
          name: GameTimerParent-${{ needs.apk.outputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            GameTimerSetup.exe
            GameTimerParent-${{ needs.apk.outputs.version }}.apk
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
